name: tests

on:
  push:
    branches: [main, codex/local-page-builder]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DB_NAME: humorpedia_test
      UPLOAD_DIR: ${{ github.workspace }}/.ci-uploads
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Start disposable MongoDB
        id: mongodb
        run: bash ../scripts/ci/start-mongodb.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: node ../scripts/sync-module-contract.cjs --check
      - run: node --test ../scripts/vps-test/test_export_local.mjs
      - run: pytest -q tests
      - name: Remove disposable MongoDB
        if: always()
        env:
          MONGO_TOOLS_CONTAINER: ${{ steps.mongodb.outputs.container_id }}
        run: if [ -n "$MONGO_TOOLS_CONTAINER" ]; then docker rm -fv "$MONGO_TOOLS_CONTAINER" >/dev/null 2>&1 || true; fi

  mongodb-integration:
    runs-on: ubuntu-latest
    env:
      DB_NAME: humorpedia_test
      UPLOAD_DIR: ${{ github.workspace }}/.ci-uploads
      PAGE_PACKAGE_INTEGRATION: '1'
      SEASON_WRITE_INTEGRATION: '1'
      READINESS_INTEGRATION: '1'
      DATABASE_INTEGRATION: '1'
      PERFORMANCE_INTEGRATION: '1'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Start disposable MongoDB
        id: mongodb
        run: bash ../scripts/ci/start-mongodb.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: >-
          pytest -q tests/test_page_package_import.py tests/test_page_package_concurrency.py
          tests/test_page_package_recovery.py tests/test_workflow_recovery_integration.py
          tests/test_season_write_integration.py tests/test_readiness_integration.py
          tests/test_database_integration.py tests/test_performance_indexes.py -rs
      - run: python -m unittest discover -s ../scripts/vps-test -p test_restore_files.py
      - name: Remove disposable MongoDB
        if: always()
        env:
          MONGO_TOOLS_CONTAINER: ${{ steps.mongodb.outputs.container_id }}
        run: if [ -n "$MONGO_TOOLS_CONTAINER" ]; then docker rm -fv "$MONGO_TOOLS_CONTAINER" >/dev/null 2>&1 || true; fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn test --watchAll=false --runInBand
        env:
          CI: 'true'
      - run: yarn build
        env:
          CI: 'true'
          REACT_APP_USE_API_PROXY: 'true'
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-build
          path: frontend/build
          retention-days: 3

  windows-tools:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/page-builder/test_worker.py
      - run: pwsh ./scripts/test-dev-workflow.ps1

  browser-smoke:
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BROWSER_BUILD_DIR: ${{ github.workspace }}/frontend/build
    steps:
      - uses: actions/checkout@v4
      - name: Start disposable MongoDB
        id: mongodb
        run: bash scripts/ci/start-mongodb.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
      - uses: actions/download-artifact@v4
        with:
          name: frontend-browser-build
          path: frontend/build
      - run: pip install -r backend/requirements.txt
      - name: Install browser tooling separately from application dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tools" --no-save playwright@1.62.1
          "$RUNNER_TEMP/browser-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Browser smoke on a disposable database
        env:
          SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/browser-smoke-artifacts
        run: |
          SMOKE_RUN_ID=$(python -c 'import uuid; print(uuid.uuid4().hex)')
          export SMOKE_RUN_ID
          export DB_NAME="humorpedia_browser_test_$SMOKE_RUN_ID"
          export NODE_PATH="$RUNNER_TEMP/browser-tools/node_modules"
          python scripts/browser-smoke/server.py > "$RUNNER_TEMP/browser-smoke-server.log" 2>&1 &
          server_pid=$!
          trap 'kill -TERM "$server_pid" 2>/dev/null || true; wait "$server_pid" || true' EXIT
          node scripts/browser-smoke/run.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke-results
          path: |
            ${{ runner.temp }}/browser-smoke-artifacts
            ${{ runner.temp }}/browser-smoke-server.log
          retention-days: 3
      - name: Remove disposable MongoDB
        if: always()
        env:
          MONGO_TOOLS_CONTAINER: ${{ steps.mongodb.outputs.container_id }}
        run: if [ -n "$MONGO_TOOLS_CONTAINER" ]; then docker rm -fv "$MONGO_TOOLS_CONTAINER" >/dev/null 2>&1 || true; fi
