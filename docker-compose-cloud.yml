# Продакшен. Перед запуском создайте .env рядом с этим файлом (шаблон — .env.example).
# Обязательные переменные: JWT_SECRET, MONGO_INITDB_ROOT_PASSWORD.
services:
  mongodb:
    image: mongo:6
    container_name: humorpedia-mongodb
    # Порт наружу НЕ публикуется: база доступна только контейнерам внутри сети compose.
    # Для отладки с хоста: ports: ["127.0.0.1:27017:27017"]
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-humorpedia}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:?Задайте MONGO_INITDB_ROOT_PASSWORD в .env}
      - MONGO_INITDB_DATABASE=${DB_NAME:-humorpedia}
    command: ["mongod", "--auth", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --host localhost --port 27017 --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --quiet --eval \"db.adminCommand('ping')\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile-cloud
    container_name: humorpedia-backend
    environment:
      - ENVIRONMENT=production
      - PYTHONUNBUFFERED=1
      - DB_NAME=${DB_NAME:-humorpedia}
      # Учётные данные отдельно, чтобы спецсимволы в пароле не ломали URI
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_USER=${MONGO_INITDB_ROOT_USERNAME:-humorpedia}
      - MONGO_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:?Задайте MONGO_INITDB_ROOT_PASSWORD в .env}
      - MONGO_AUTH_SOURCE=admin
      - JWT_SECRET=${JWT_SECRET:?Задайте JWT_SECRET в .env (не короче 32 символов)}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - BACKUP_DIR=/app/backups
      - VK_CLIENT_ID=${VK_CLIENT_ID:-}
      - VK_CLIENT_SECRET=${VK_CLIENT_SECRET:-}
      - VK_REDIRECT_URI=${VK_REDIRECT_URI:-}
      - YANDEX_CLIENT_ID=${YANDEX_CLIENT_ID:-}
      - YANDEX_CLIENT_SECRET=${YANDEX_CLIENT_SECRET:-}
      - YANDEX_REDIRECT_URI=${YANDEX_REDIRECT_URI:-}
    volumes:
      - uploads_data:/app/uploads
      - backups_data:/app/backups
      - imported_images_volume:/app/media/imported/images
      - images_volume:/app/images
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8001:8001"
    command: gunicorn server:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8001
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Бэкап MongoDB: при старте и далее раз в BACKUP_INTERVAL секунд, хранит последние KEEP_LAST_N архивов
  backup:
    build:
      context: ./backup
    container_name: humorpedia-backup
    environment:
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_USER=${MONGO_INITDB_ROOT_USERNAME:-humorpedia}
      - MONGO_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:?Задайте MONGO_INITDB_ROOT_PASSWORD в .env}
      - MONGO_AUTH_SOURCE=admin
      - DB_NAME=${DB_NAME:-humorpedia}
      - BACKUP_DIR=/backup/output
      - BACKUP_INTERVAL=${BACKUP_INTERVAL:-86400}
      - KEEP_LAST_N=${KEEP_LAST_N:-14}
    volumes:
      - backups_data:/backup/output
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile-cloud
      args:
        - REACT_APP_BACKEND_URL=${REACT_APP_BACKEND_URL:-http://localhost:8001}
        - CACHEBUST=${CACHEBUST:-20260305}
    container_name: humorpedia-frontend
    environment:
      - NODE_ENV=production
    volumes:
      - frontend_media:/usr/share/nginx/html/media
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mongo_data:
    driver: local

  frontend_media:
    driver: local

  imported_images_volume:
    driver: local

  images_volume:
    driver: local

  uploads_data:
    driver: local

  backups_data:
    driver: local
