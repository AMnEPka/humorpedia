# Only the host nginx (through this existing Docker bridge gateway) is trusted.
# Recheck the gateway if the Compose network is ever deleted/recreated.
map "$realip_remote_addr:$http_x_forwarded_proto" $backend_scheme {
    default $scheme;
    "172.18.0.1:https" https;
}
server {
    listen 80;
    server_name _;
    server_tokens off;
    set_real_ip_from 172.18.0.1;
    real_ip_header X-Real-IP;
    real_ip_recursive off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location = /config.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location = /api/page-packages/preview {
        client_max_body_size 52m;
        proxy_pass http://backend:8001;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $backend_scheme;
        proxy_read_timeout 120s;
    }
    location ~ ^/(api|media|images|uploads)(/|$) {
        proxy_pass http://backend:8001;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $backend_scheme;
        proxy_read_timeout 120s;
    }
    location = /healthz {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
