server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 77.105.139.231;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/humorpedia-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    # Until a trusted certificate is issued, do not expose the app over HTTP.
    location / { return 503; }
}
