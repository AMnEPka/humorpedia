# Host nginx handles public TLS; Docker ports stay on loopback or unpublished.
limit_req_zone $binary_remote_addr zone=humorpedia_login:1m rate=5r/m;
limit_req_zone $binary_remote_addr zone=humorpedia_api:1m rate=10r/s;
limit_req_status 429;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 77.105.139.231;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/humorpedia-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://77.105.139.231$request_uri; }
}
server {
    listen 443 ssl default_server;
    server_name 77.105.139.231;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/humorpedia-vps-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/humorpedia-vps-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:HumorpediaTLS:1m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    client_max_body_size 20m;
    client_body_timeout 30s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
    location = /api/auth/login {
        limit_req zone=humorpedia_login burst=5 nodelay;
        include /etc/nginx/snippets/humorpedia-proxy.conf;
    }
    location = /api/page-packages/preview {
        client_max_body_size 52m;
        limit_req zone=humorpedia_api burst=40 nodelay;
        include /etc/nginx/snippets/humorpedia-proxy.conf;
    }
    location ^~ /api/ {
        limit_req zone=humorpedia_api burst=40 nodelay;
        include /etc/nginx/snippets/humorpedia-proxy.conf;
    }
    location / {
        include /etc/nginx/snippets/humorpedia-proxy.conf;
    }
}
