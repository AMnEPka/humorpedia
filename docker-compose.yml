services:
  mongodb:
    image: mongo:6
    container_name: humorpedia-mongodb
    # SECURITY:
    # - Do NOT publish 27017 to the internet.
    # - If you need local access from the host for debugging, bind to localhost only:
    #   ports: ["127.0.0.1:27017:27017"]
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-humorpedia}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-change_me_in_prod}
      # Optional: default DB created on first init (does not create users)
      - MONGO_INITDB_DATABASE=${DB_NAME:-humorpedia}
    command: ["mongod", "--auth", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      # NOTE: use CMD-SHELL so container env vars expand (CMD array doesn't expand $VARS)
      test:
        [
          "CMD-SHELL",
          "mongosh --host localhost --port 27017 --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --quiet --eval \"db.adminCommand('ping')\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: humorpedia-backend
    # env_file:
    #   - ./backend/.env
    environment:
      # Override for docker network
      - DB_NAME=${DB_NAME:-humorpedia}
      # Provide credentials separately so special characters don't break MongoDB URI parsing
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_USER=${MONGO_INITDB_ROOT_USERNAME:-humorpedia}
      - MONGO_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-change_me_in_prod}
      - MONGO_AUTH_SOURCE=admin
      - CORS_ORIGINS=*
      - BACKUP_DIR=/app/backups
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
      - ./backups:/app/backups
      # Docker volume for imported images (accessible via /media/imported/images/*)
      # Read-write access for uploading files through web interface
      - imported_images_volume:/app/frontend/public/media/imported/images
      # Docker volume with site images (accessible via /images/*)
      # Read-write access for uploading files through web interface
      - images_volume:/app/images
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8001:8001"
    # Hot reload disabled due to inotify limits being exceeded in Docker
    # Restart container manually after code changes: docker-compose restart backend
    command: uvicorn server:app --host 0.0.0.0 --port 8001
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: humorpedia-frontend
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WDS_SOCKET_PORT=0
      - REACT_APP_BACKEND_URL=http://localhost:8001
      # Запросы к API идут на тот же origin (127.0.0.1:3000/api), dev-сервер проксирует на backend — устраняет таймауты и ERR_CONNECTION_RESET
      - REACT_APP_USE_API_PROXY=true
      - DOCKER_ENV=true
      # Suppress deprecation warnings and increase memory limit to prevent ENOMEM errors
      - NODE_OPTIONS=--no-deprecation --max-old-space-size=4096
      # Increase file descriptor limit for watchpack
      - WATCHPACK_POLLING=true
      - WATCHPACK_IGNORED=/app/public
    ulimits:
      # Increase file descriptor limit to prevent ENOMEM errors
      nofile:
        soft: 131072
        hard: 131072
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      # Exclude public/media from frontend volume to prevent webpack from scanning 3000+ images
      # The empty directory from Dockerfile will be used instead of real files from host
      # Media files are served by backend (see backend volumes), so frontend doesn't need them
      - frontend_media:/app/public/media
    depends_on:
      - backend
    ports:
      - "3000:3000"
    command: yarn start
    restart: unless-stopped

  backup:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: humorpedia-backup
    environment:
      - DB_NAME=${DB_NAME:-humorpedia}
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_USER=${MONGO_INITDB_ROOT_USERNAME:-humorpedia}
      - MONGO_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-change_me_in_prod}
      - MONGO_AUTH_SOURCE=admin
      - BACKUP_DIR=/app/backups
      - BACKUP_CHECK_INTERVAL=3600
    volumes:
      - ./backups:/app/backups
    depends_on:
      mongodb:
        condition: service_healthy
      backend:
        condition: service_started
    entrypoint: []
    command: python scripts/backup_service.py
    restart: unless-stopped

volumes:
  mongo_data:
  # Isolate node_modules from host mount so deps stay inside container; named for clear docker volume ls
  frontend_node_modules:
  # Empty volume for frontend public/media to prevent webpack from scanning 3000+ images
  # Media files are served by backend, so frontend doesn't need them
  frontend_media:
  # Docker volume for imported images (migrated from frontend/public/media/imported/images)
  # Stores all imported media files separately from source code
  imported_images_volume:
  # Named volume for site images (kvn-team, etc.)
  # Mount this volume on production server with actual images
  images_volume:
