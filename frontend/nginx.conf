server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Кэширование статики (кроме config.js и HTML)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Конфигурационный файл не версионируется — его нельзя кэшировать надолго,
    # иначе после деплоя браузер может долго использовать старые настройки.
    location = /config.js {
        expires -1;
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Для media файлов (если фронт их все же обслуживает)
    location /media/ {
        alias /usr/share/nginx/html/media/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Простое health-окно для проверки доступности фронта
    location = /healthz {
        default_type application/json;
        return 200 '{"status": "ok"}';
    }

    # Все запросы отправляем в index.html (для SPA)
    location / {
        try_files $uri $uri/ /index.html;
        # index.html должен всегда подтягиваться свежий после деплоя
        expires -1;
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Обработка ошибок
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}